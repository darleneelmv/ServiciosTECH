[build]
  publish = "."

[[redirects]]
  from = "/admin"
  to = "/entrar/"
  status = 301
[[redirects]]
  from = "/admin/*"
  to = "/entrar/"
  status = 301

[[headers]]
  for = "/contenido/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
[[headers]]
  for = "/entrar/*"
  [headers.values]
    X-Robots-Tag = "noindex"
