[build]
  publish = "."

[[redirects]]
  from = "/admin"
  to = "/entrar/"
  status = 301
[[redirects]]
  from = "/admin/*"
  to = "/entrar/"
  status = 301

[[headers]]
  for = "/contenido/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
[[headers]]
  for = "/entrar/*"
  [headers.values]
    X-Robots-Tag = "noindex"

# Archivos internos que no deben verse en el sitio
[[redirects]]
  from = "/README.md"
  to = "/"
  status = 301
  force = true
[[redirects]]
  from = "/netlify.toml"
  to = "/"
  status = 301
  force = true
